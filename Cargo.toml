[package]
name = "hal"
version = "5.1.0"
edition = "2021"
description = "Stop hook quality gate + learning pipeline for coding agents"
license = "MIT"

[[bin]]
name = "hal"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
